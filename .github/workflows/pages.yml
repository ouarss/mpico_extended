# Publishes monitor/ as the GitHub Pages site, so the tool is reachable over
# HTTPS. WebSerial needs a secure context, and the page is fully static: there
# is nothing to build, the folder is uploaded as-is.
#
# Requires Pages to be enabled with "GitHub Actions" as the source, which on a
# free plan means the repository must be public.
#
# Runs on any push touching monitor/, so the published site can never drift
# from the repository.
name: Deploy monitor to Pages

on:
  push:
    branches: [main]
    paths:
      - 'monitor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Never run two deployments at once, but let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: monitor
      - id: deployment
        uses: actions/deploy-pages@v4
      # Only the live deployment is worth keeping: the older entries pile up in
      # the Deployments panel without adding anything, so each deploy prunes
      # everything but itself.
      - name: Prune old deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 100,
            });
            // Newest first; keep [0], the deployment this run just created.
            for (const d of deployments.slice(1)) {
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: d.id, state: 'inactive',
              });
              await github.rest.repos.deleteDeployment({
                owner, repo, deployment_id: d.id,
              });
            }
